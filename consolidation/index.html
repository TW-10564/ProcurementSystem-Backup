<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE Consolidation Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --card:#FFFFFF; --ink:#111827; --muted:#6B7280; --faint:#9AA3B2;
  --line:#E7EBF1; --line2:#F0F3F8;
  --indigo:#2563EB; --indigo-d:#1D4ED8; --indigo-bg:#EEF4FF;
  --green:#047857; --green-bg:#E7F6EF;
  --amber:#B45309; --amber-bg:#FBF1E1;
  --orange:#C2410C; --orange-bg:#FBEEE6;
  --red:#DC2626; --red-bg:#FCEDED;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 2px 10px rgba(17,24,39,.045);
  --shadow-lg:0 12px 34px rgba(37,99,235,.14);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Inter','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}
.wrap{max-width:1240px;margin:0 auto;padding:36px 44px 90px}

/* ── top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}
.brand{display:flex;align-items:center;gap:15px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--indigo) 0%,#3B82F6 100%);
  box-shadow:var(--shadow-lg);font-size:21px}
.brand h1{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.brand p{font-size:.88rem;color:var(--muted);margin-top:3px}
.actions{display:flex;align-items:center;gap:11px}

/* ── lang toggle ── */
.lang{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
  font-size:.8rem;padding:5px 11px;border-radius:7px;cursor:pointer;transition:.15s}
.lang button.on{background:var(--indigo);color:#fff}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;
  color:var(--ink);font:inherit;font-weight:600;font-size:.84rem;padding:9px 15px;border-radius:10px;
  cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--indigo);color:var(--indigo);transform:translateY(-1px)}
.btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn.primary:hover{background:var(--indigo-d);color:#fff}
.btn svg{width:15px;height:15px}

/* ── KPI cards ── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-bottom:30px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.15s}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.kpi .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.kpi .lab{font-size:.83rem;color:var(--muted);font-weight:600}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.kpi .val{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .sub{font-size:.78rem;color:var(--faint);margin-top:10px;font-weight:500}
.kpi.acc .val{font-size:1.6rem}

/* ── tabs ── */
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:6px;margin-bottom:24px;width:fit-content;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.9rem;
  padding:11px 22px;border-radius:10px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--indigo);color:#fff}
.panel{display:none}
.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── card / table ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .hd{padding:20px 24px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card .hd h2{font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.card .hd .desc{font-size:.83rem;color:var(--muted);margin-top:4px;font-weight:400}
.tablewrap{overflow:auto;max-height:600px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead th{position:sticky;top:0;background:#F8FAFC;color:var(--muted);font-weight:600;text-align:left;
  padding:14px 20px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;font-size:.8rem;
  text-transform:none;cursor:pointer;user-select:none}
thead th.num{text-align:right}
thead th .ar{opacity:.35;font-size:.7rem;margin-left:3px}
thead th.sort .ar{opacity:1;color:var(--indigo)}
tbody td{padding:13px 20px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#F8FAFD}
tbody tr:last-child td{border-bottom:0}
.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--faint)}

/* ── pills / badges ── */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;
  padding:4px 11px;border-radius:999px;line-height:1.4}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.p-ok{color:var(--green);background:var(--green-bg)}
.p-exc{color:var(--orange);background:var(--orange-bg)}
.p-low{color:var(--amber);background:var(--amber-bg)}
.p-neg{color:var(--red);background:var(--red-bg)}
.p-pass{color:var(--green);background:var(--green-bg)}
.p-warn{color:var(--amber);background:var(--amber-bg)}
.p-fail{color:var(--red);background:var(--red-bg)}

/* ── toolbar (filters) ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line2)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;
  font:inherit;font-size:.84rem;background:#fff;color:var(--ink);outline:none;transition:.15s}
.search input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:.84rem;
  background:#fff;color:var(--ink);outline:none;cursor:pointer}
select:focus{border-color:var(--indigo)}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-weight:600;
  font-size:.76rem;padding:7px 12px;border-radius:999px;cursor:pointer;transition:.15s}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.count{margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:500}

/* ── summary bars ── */
.bar{position:relative;height:7px;border-radius:999px;background:var(--line2);min-width:60px;overflow:hidden}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--indigo),#818CF8)}

/* ── verdict banner ── */
.banner{display:flex;align-items:center;gap:11px;padding:14px 18px;border-radius:12px;font-weight:600;
  font-size:.9rem;margin:16px 0}
.banner.ok{background:var(--green-bg);color:var(--green)}
.banner.bad{background:var(--red-bg);color:var(--red)}
.banner .b{font-size:1.1rem}

.foot{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:.82rem;color:var(--faint)}
.verbadge{position:fixed;right:14px;bottom:12px;background:var(--ink);color:#fff;font-size:.7rem;
  font-weight:600;padding:5px 11px;border-radius:999px;opacity:.55;z-index:50;font-variant-numeric:tabular-nums}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:1fr}}
</style>
</head>

    <button class="tab" data-tab="recon" id="tab-recon" onclick="setTab('recon')"></button>
    <button class="tab" data-tab="anom" id="tab-anom" onclick="setTab('anom')"></button>
    <button class="tab" data-tab="proc" id="tab-proc" onclick="setTab('proc')"></button>
    <button class="tab" data-tab="master" id="tab-master" onclick="setTab('master')"></button>

  <div class="panel on" id="p-sum">

      <div class="hd"><div><h2 id="h-sum"></h2><div class="desc" id="d-sum"></div></div></div>
      <div class="tablewrap"><table id="tbl-sum"></table></div>

  <!-- Full list -->
  <div class="panel" id="p-list">

      <div class="toolbar">

        <select id="fcat" onchange="renderList()"></select>

        <span class="count" id="cnt"></span>
      </div>
      <div class="tablewrap"><table id="tbl-list"></table></div>
    </div>
  </div>

  <!-- Reconciliation -->
  <div class="panel" id="p-recon">
    <div id="verdict"></div>
    <div class="card">
      <div class="hd"><div><h2 id="h-recon"></h2><div class="desc" id="d-recon"></div></div></div>
      <div class="tablewrap"><table id="tbl-recon"></table></div>
    </div>
  </div>

  <!-- Anomaly detection -->
  <div class="panel" id="p-anom">
    <div id="anom-body"><div class="card"><div class="hd"><h2 id="anom-loading">…</h2></div></div></div>
  </div>

  <!-- Procurement (overdue / incoming-excess / price history) -->
  <div class="panel" id="p-proc">
    <div id="proc-body"><div class="card"><div class="hd"><h2 id="proc-loading">…</h2></div></div></div>
  </div>

  <!-- Master automation -->
  <div class="panel" id="p-master">
    <div id="master-body"><div class="card"><div class="hd"><h2 id="master-loading">…</h2></div></div></div>
  </div>

  <!-- Stock auto-match -->
  <div class="panel" id="p-stock">
    <div id="stock-body"><div class="card"><div class="hd"><h2 id="stock-loading">…</h2></div></div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

function setLang(l){LANG=l;document.documentElement.lang=l;
  document.getElementById('lang-ja').classList.toggle('on',l==='ja');
  document.getElementById('lang-en').classList.toggle('on',l==='en');
  renderAll();}
let MASTER=null, masterLoading=false;
function setTab(t){TAB=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+t).classList.add('on');
  if(t==='master' && !MASTER && !masterLoading) loadMaster();
  if(t==='anom' && !ANOM && !anomLoading) loadAnom();
  if(t==='proc' && !PROC && !procLoading) loadProc();
  if(t==='stock' && !STOCK && !stockLoading) loadStock();}

let PROC=null, procLoading=false, procQ='';
async function loadProc(){
  procLoading=true;
  document.getElementById('proc-loading').textContent=T('p_loading');
  try{ PROC=await (await fetch('/procurement')).json(); renderProc(); }
  catch(e){ document.getElementById('proc-loading').textContent='error: '+e; }
  procLoading=false;
}
function renderProc(){
  if(!PROC){document.getElementById('proc-loading').textContent=T('p_loading');return;}
  const p=PROC;
  // overdue table (top 100)
  let ov='';
  for(const r of p.overdue.slice(0,100)){
    ov+=`<tr><td><b>${r.cat}</b></td><td>${r.sku}</td><td class="dim">${r.delivery||'—'}</td>
      <td class="num"><span class="pill p-neg">${r.days}</span></td><td class="dim">${r.supplier||'—'}</td>
      <td class="num mono dim">${r.po||'—'}</td></tr>`;
  }
  // incoming-excess
  let ie='';
  for(const r of p.incoming){
    ie+=`<tr><td><b>${r.cat}</b></td><td>${r.sku}</td><td class="num mono">${r.stock_days}</td>
      <td class="num mono">${fmt(r.inbound)}</td><td class="num"><span class="pill p-exc">${r.days_after}</span></td>
      <td class="num mono dim">${r.threshold}</td></tr>`;
  }
  // price history (client-side search)
  const q=procQ.toLowerCase();
  const pr=p.price.filter(r=>!q||r.sku.toLowerCase().includes(q)||(r.suppliers||'').toLowerCase().includes(q)).slice(0,300);
  let ph='';
  for(const r of pr){
    ph+=`<tr><td><b>${r.cat}</b></td><td>${r.sku}</td><td class="num mono">${fmt(r.usd,2)}</td>
      <td class="num mono">${fmt(r.jpy)}</td><td>${r.supplier||'—'}</td><td class="dim">${r.suppliers||''}</td>
      <td class="num mono">${r.orders}</td><td class="dim">${r.date||''}</td></tr>`;
  }
  document.getElementById('proc-body').innerHTML=`
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
      <div class="kpi"><div class="top"><span class="lab">${T('p_overdue')}</span><span class="ic" style="background:var(--red-bg)">⏰</span></div><div class="val">${p.counts.overdue}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('p_incoming')}</span><span class="ic" style="background:var(--orange-bg)">📦</span></div><div class="val">${p.counts.incoming}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('p_price')}</span><span class="ic" style="background:var(--indigo-bg)">💱</span></div><div class="val">${p.counts.price}</div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><div class="hd"><div><h2>${T('p_overdue')}</h2><div class="desc">${T('p_overdue_d')}</div></div></div>
      <div class="tablewrap" style="max-height:360px"><table><thead><tr><th>${T('c_cat')}</th><th>${T('c_sku')}</th><th>${T('c_delivery')}</th><th class="num">${T('c_overduedays')}</th><th>${T('c_supplier')}</th><th class="num">${T('c_po')}</th></tr></thead><tbody>${ov}</tbody></table></div></div>
    <div class="card" style="margin-bottom:18px"><div class="hd"><div><h2>${T('p_incoming')}</h2><div class="desc">${T('p_incoming_d')}</div></div></div>
      <div class="tablewrap" style="max-height:360px"><table><thead><tr><th>${T('c_cat')}</th><th>${T('c_sku')}</th><th class="num">${T('c_stockdays')}</th><th class="num">${T('c_inbound')}</th><th class="num">${T('c_after')}</th><th class="num">${T('c_thr')}</th></tr></thead><tbody>${ie}</tbody></table></div></div>
    <div class="card"><div class="hd"><div><h2>${T('p_price')}</h2><div class="desc">${T('p_price_d')}</div></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input value="${procQ}" oninput="procQ=this.value;renderProc()" placeholder="${T('search')}"></div></div>
      <div class="tablewrap" style="max-height:420px"><table><thead><tr><th>${T('c_cat')}</th><th>${T('c_sku')}</th><th class="num">${T('c_usd')}</th><th class="num">${T('c_jpy')}</th><th>${T('c_supplier')}</th><th>${T('c_suppliers')}</th><th class="num">${T('c_orders')}</th><th>${T('a_when')}</th></tr></thead><tbody>${ph}</tbody></table></div></div>`;
}

let ANOM=null, anomLoading=false;
let STOCK=null, stockLoading=false, stockFilter='all', stockQ='';
async function loadAnom(){
  anomLoading=true;
  document.getElementById('anom-loading').textContent=T('a_loading');
  try{ ANOM=await (await fetch('/anomalies')).json(); renderAnom(); }
  catch(e){ document.getElementById('anom-loading').textContent='error: '+e; }
  anomLoading=false;
}
function renderAnom(){
  if(!ANOM){document.getElementById('anom-loading').textContent=T('a_loading');return;}
  const a=ANOM, s=a.by_severity;
  const sevPill={High:'p-neg',Med:'p-low',Low:'p-pass'};
  const sevLab={High:T('a_high'),Med:T('a_med'),Low:T('a_low')};
  const newTag=`<span class="pill" style="background:#E0E7FF;color:#4338CA">${T('a_newtag')}</span> `;
  let rows='';
  for(const f of a.findings){
    rows+=`<tr><td><span class="pill ${sevPill[f.severity]}">${f.severity}</span></td>
      <td>${f.is_new?newTag:''}<b>${f.cat}</b></td><td>${f.sku}</td><td class="dim">${f.sheet}</td>
      <td class="dim">${f.field}</td><td class="num mono">${f.value}</td><td>${f.message}</td></tr>`;
  }
  let hist='';
  for(const h of (a.history||[])){
    hist+=`<tr><td class="dim">${h.ts}</td><td class="num mono">${h.total}</td>
      <td class="num mono" style="color:var(--indigo)">+${h.new}</td>
      <td class="num mono" style="color:var(--green)">−${h.fixed}</td></tr>`;
  }
  document.getElementById('anom-body').innerHTML=`
    <div class="kpis" style="grid-template-columns:repeat(6,1fr);margin-bottom:18px">
      <div class="kpi"><div class="top"><span class="lab">${T('a_total')}</span><span class="ic" style="background:var(--indigo-bg)">🔎</span></div><div class="val">${a.total}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('a_high')}</span><span class="ic" style="background:var(--red-bg)">❗</span></div><div class="val">${s.High}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('a_med')}</span><span class="ic" style="background:var(--amber-bg)">⚠️</span></div><div class="val">${s.Med}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('a_low')}</span><span class="ic" style="background:var(--green-bg)">ℹ️</span></div><div class="val">${s.Low}</div></div>
      <div class="kpi" style="--accent:var(--indigo)"><div class="top"><span class="lab">${T('a_new')}</span></div><div class="val" style="color:var(--indigo)">${a.new_count}</div><div class="sub">${T('a_since')}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('a_fixed')}</span></div><div class="val" style="color:var(--green)">${a.fixed_count}</div><div class="sub">${T('a_since')}</div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><div class="hd"><div><h2>${T('a_title')}</h2><div class="desc">${T('a_desc')}　${a.last_run?('· '+T('a_lastrun')+': '+a.last_run):''}</div></div></div>
      <div class="tablewrap"><table>
        <thead><tr><th>${T('c_sev')}</th><th>${T('c_cat')}</th><th>${T('c_sku')}</th>
          <th>${T('c_sheet')}</th><th>${T('c_field')}</th><th class="num">${T('c_value')}</th><th>${T('c_msg')}</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>
    <div class="card"><div class="hd"><h2>${T('a_history')}</h2></div>
      <div class="tablewrap" style="max-height:240px"><table>
        <thead><tr><th>${T('a_when')}</th><th class="num">${T('a_total')}</th><th class="num">${T('a_new')}</th><th class="num">${T('a_fixed')}</th></tr></thead>
        <tbody>${hist}</tbody></table></div></div>`;
}

async function loadMaster(){
  masterLoading=true;
  document.getElementById('master-loading').textContent=T('m_loading');
  try{ MASTER=await (await fetch('/master')).json(); renderMaster(); }
  catch(e){ document.getElementById('master-loading').textContent='error: '+e; }
  masterLoading=false;
}

function renderMaster(){
  if(!MASTER){document.getElementById('master-loading').textContent=T('m_loading');return;}
  const m=MASTER;
  const bd=m.boundary?? T('m_boundary').replace('{a}',m.actual_through).replace('{s}',m.slot_from);
  // KPI + reconciliation table
  let recon=`<table><thead><tr><th>${T('c_cat')}</th><th class="num">${T('c_parsed')}</th>
    <th class="num">cells</th><th class="num">match</th><th class="num">${T('m_overall')}</th></tr></thead><tbody>`;
  for(const c of m.categories){
    const pc=c.rate>=99?'p-pass':c.rate>=90?'p-low':'p-fail';
    recon+=`<tr><td><b>${c.cat}</b></td><td class="num mono">${c.parts}</td>
      <td class="num mono">${c.cells}</td><td class="num mono">${c.match}</td>
      <td class="num"><span class="pill ${pc}">${c.rate}%</span></td></tr>`;
  }
  recon+='</tbody>';
  // preview table
  let prev=`<table><thead><tr><th>${T('c_cat')}</th><th>${T('c_sku')}</th>`;
  m.months.forEach((mo,i)=>{ const slot=i>=m.hist_count;
    prev+=`<th class="num" style="${slot?'background:var(--amber-bg);color:var(--amber)':''}">${mo}</th>`;});
  prev+='</tr></thead><tbody>';
  for(const r of m.preview){
    prev+=`<tr><td><b>${r.cat}</b></td><td>${r.sku}</td>`;
    for(const c of r.cells){
      if(c.slot) prev+=`<td class="num mono" style="background:var(--amber-bg);color:var(--amber)" title="予測 / forecast">${c.v===null?'<span class=dim>—</span>':c.v}</td>`;
      else prev+=`<td class="num mono">${c.v===null?'<span class=dim>—</span>':c.v}</td>`;
    }
    prev+='</tr>';
  }
  prev+='</tbody>';

  document.getElementById('master-body').innerHTML=`
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
      <div class="kpi"><div class="top"><span class="lab">${T('m_overall')}</span><span class="ic" style="background:var(--green-bg)">✅</span></div>
        <div class="val">${m.overall}%</div><div class="sub">${m.categories.length} ${T('c_cat')}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('m_histcol')}</span><span class="ic" style="background:var(--indigo-bg)">📥</span></div>
        <div class="val" style="font-size:1.2rem">〜${m.actual_through}</div></div>
      <div class="kpi"><div class="top"><span class="lab">${T('m_slotcol')}</span><span class="ic" style="background:var(--amber-bg)">★</span></div>
        <div class="val" style="font-size:1.2rem">${m.slot_from}〜</div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><div class="hd"><div><h2>${T('m_recon')}</h2>
      <div class="desc">${T('m_desc')}</div></div>
      <a class="btn primary" href="/master/download">${T('m_dlbtn')}</a></div>
      <div class="tablewrap">${recon}</div></div>
    <div class="card"><div class="hd"><h2>${T('m_preview')}</h2></div>
      <div class="tablewrap" style="max-height:460px">${prev}</div></div>`;
}

async function loadStock(){
  stockLoading=true;
  document.getElementById('stock-loading').textContent=T('s_loading');
  try{ STOCK=await (await fetch('/stock')).json(); renderStock(); }
  catch(e){ document.getElementById('stock-loading').textContent='error: '+e; }
  stockLoading=false;
}
function renderStock(){
  if(!STOCK){document.getElementById('stock-loading').textContent=T('s_loading');return;}
  const s=STOCK;
  if(s.error){
    document.getElementById('stock-body').innerHTML=
      '<div class="card"><div class="hd"><h2 style="color:var(--red)">'+T('s_error')+'</h2><div class="desc">'+s.error+'</div></div></div>';
    return;
  }
  let catRows='';
  for(const c of s.by_cat){
    const pillCls=c.structural?'p-pass':(c.rate>=80?'p-pass':c.rate>=50?'p-low':'p-fail');
    const note=c.structural?T('s_structural'):'';
    catRows+='<tr><td><b>'+c.cat+'</b></td><td class="num mono">'+c.matched+'</td>'
      +'<td class="num mono">'+c.total+'</td>'
      +'<td class="num"><span class="pill '+pillCls+'">'+c.rate+'%</span></td>'
      +'<td class="dim">'+note+'</td></tr>';
  }
  const q=stockQ.toLowerCase();
  const filtered=s.rows.filter(function(r){
    if(stockFilter==='matched'&&!r.matched) return false;
    if(stockFilter==='unmatched'&&r.matched) return false;
    if(q&&!r.sku.toLowerCase().includes(q)&&!(r.adana||'').toLowerCase().includes(q)) return false;
    return true;
  }).slice(0,500);
  let rows='';
  for(const r of filtered){
    const qtyCell=r.qty!==null&&r.qty!==undefined?'<b>'+r.qty.toLocaleString()+'</b>':'<span class="dim">—</span>';
    const methodCell=r.method?'<span class="pill p-pass">'+r.method+'</span>':'<span class="dim">—</span>';
    const rowStyle=!r.matched?' style="background:var(--red-bg)"':'';
    rows+='<tr'+rowStyle+'><td><b>'+r.cat+'</b></td><td>'+r.sku+'</td>'
      +'<td class="num">'+qtyCell+'</td><td class="dim">'+(r.adana||'—')+'</td>'
      +'<td>'+methodCell+'</td><td class="num mono dim">'+fmt(r.bal,1)+'</td></tr>';
  }
  const filterBtns=['all','matched','unmatched'].map(function(v){
    const lbl=v==='all'?T('all'):v==='matched'?T('s_filter_matched'):T('s_filter_unmatched');
    const on=stockFilter===v?' on':'';
    return '<button class="chip'+on+'" onclick="stockFilter=\''+v+'\';renderStock()">'+lbl+'</button>';
  }).join('');
  document.getElementById('stock-body').innerHTML=
    '<div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">'
    +'<div class="kpi"><div class="top"><span class="lab">'+T('s_matched')+'</span><span class="ic" style="background:var(--indigo-bg)">🔗</span></div>'
    +'<div class="val">'+s.matched+'<span style="font-size:1rem;color:var(--muted)">/'+s.total+'</span></div></div>'
    +'<div class="kpi"><div class="top"><span class="lab">'+T('s_coverage')+'</span><span class="ic" style="background:var(--green-bg)">📊</span></div>'
    +'<div class="val">'+s.coverage+'%</div></div>'
    +'<div class="kpi"><div class="top"><span class="lab">'+T('s_parts')+'</span><span class="ic" style="background:var(--amber-bg)">⚙️</span></div>'
    +'<div class="val">'+s.parts_coverage+'%</div><div class="sub">NotePC・梱包除く</div></div>'
    +'<div class="kpi"><div class="top"><span class="lab">'+T('s_source')+'</span><span class="ic" style="background:var(--indigo-bg)">📁</span></div>'
    +'<div class="val" style="font-size:1rem">'+s.source+'</div></div>'
    +'</div>'
    +'<div class="card" style="margin-bottom:18px">'
    +'<div class="hd"><div><h2>'+T('s_by_cat')+'</h2></div>'
    +'<a class="btn primary" href="/stock/download">'+T('s_dl')+'</a></div>'
    +'<div class="tablewrap" style="max-height:340px"><table>'
    +'<thead><tr><th>'+T('c_cat')+'</th><th class="num">対応</th><th class="num">合計</th><th class="num">対応率</th><th></th></tr></thead>'
    +'<tbody>'+catRows+'</tbody></table></div></div>'
    +'<div class="card">'
    +'<div class="toolbar">'
    +'<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>'
    +'<input value="'+stockQ.replace(/"/g,'&quot;')+'" oninput="stockQ=this.value;renderStock()" placeholder="'+T('search')+'"></div>'
    +'<div class="chips">'+filterBtns+'</div>'
    +'<span class="count">'+filtered.length+' / '+s.rows.length+'</span>'
    +'</div>'
    +'<div class="hd"><div><h2>'+T('s_detail')+'</h2><div class="desc">'+T('s_desc')+'</div></div></div>'
    +'<div class="tablewrap" style="max-height:500px"><table>'
    +'<thead><tr><th>'+T('c_cat')+'</th><th>'+T('c_sku')+'</th>'
    +'<th class="num">'+T('s_qty')+'</th><th>'+T('s_adana')+'</th>'
    +'<th>'+T('s_method')+'</th><th class="num">'+T('c_bal')+'</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div></div>';
}
function statusPills(r){
  let h='';
  if(r.neg) h+=`<span class="pill p-neg">${T('st_neg')}</span> `;
  if(r.exc) h+=`<span class="pill p-exc">${T('st_exc')}</span> `;
  if(r.low) h+=`<span class="pill p-low">${T('st_low')}</span> `;
  if(!h) h=`<span class="pill p-ok">${T('st_ok')}</span>`;
  return h;
}

function renderKpis(){
  const k=DATA.kpi;
  const gateCls=k.gate_ok?'p-pass':'p-fail';
  const gateTxt=(k.gate_ok?'✓ ':'⚠ ')+(k.gate_ok?T('pass'):T('review'));
  const cards=[
    {lab:T('total'),val:k.total.toLocaleString(),sub:'/ '+DATA.expected_total+' '+T('expected'),ic:'📦',bg:'var(--indigo-bg)'},
    {lab:T('excess'),val:k.excess,sub:'',ic:'🔴',bg:'var(--orange-bg)'},
    {lab:T('low'),val:k.low,sub:'',ic:'🟡',bg:'var(--amber-bg)'},
    {lab:T('negative'),val:k.negative,sub:'',ic:'❗',bg:'var(--red-bg)'},
    {lab:T('gate'),val:`<span class="pill ${gateCls}" style="font-size:.95rem;padding:5px 12px">${gateTxt}</span>`,
       sub:k.gate_ok?'100% · '+k.pass+' PASS':k.fail+' FAIL',ic:'✅',bg:'var(--green-bg)',acc:true},
  ];
  document.getElementById('kpis').innerHTML=cards.map(c=>`
    <div class="kpi ${c.acc?'acc':''}">
      <div class="top"><span class="lab">${c.lab}</span><span class="ic" style="background:${c.bg}">${c.ic}</span></div>
      <div class="val">${c.val}</div>${c.sub?`<div class="sub">${c.sub}</div>`:''}
    </div>`).join('');
}

function th(label,key,tab,num){
  const s=sortBy[tab]; const on=s&&s.k===key;
  const ar=on?(s.dir>0?'▲':'▼'):'↕';
  return `<th class="${num?'num':''} ${on?'sort':''}" onclick="sortCol('${tab}','${key}')">${label}<span class="ar">${ar}</span></th>`;
}
function sortCol(tab,k){const s=sortBy[tab];s.dir=(s.k===k)?-s.dir:1;s.k=k;
  tab==='list'?renderList():renderSum();}

function renderSum(){
  const rows=[...DATA.summary];
  const s=sortBy.sum; const max=Math.max(...rows.map(r=>r.skus));
  rows.sort((a,b)=> (a[s.k]>b[s.k]?1:a[s.k]<b[s.k]?-1:0)*s.dir);
  document.getElementById('h-sum').textContent=T('h_sum');
  document.getElementById('d-sum').textContent=T('d_sum');
  let h=`<thead><tr>
    ${th(T('c_cat'),'category','sum')}${th(T('c_file'),'file','sum')}
    ${th(T('c_skus'),'skus','sum',1)}<th>&nbsp;</th>
    ${th(T('st_exc'),'exc','sum',1)}${th(T('st_low'),'low','sum',1)}${th(T('st_neg'),'neg','sum',1)}
  </tr></thead><tbody>`;
  for(const r of rows){
    h+=`<tr>
      <td><b>${r.category}</b></td><td class="dim">${r.file}</td>
      <td class="num"><b>${r.skus}</b></td>
      <td style="width:120px"><div class="bar"><span style="width:${r.skus/max*100}%"></span></div></td>
      <td class="num">${r.exc?`<span class="pill p-exc">${r.exc}</span>`:'<span class="dim">0</span>'}</td>
      <td class="num">${r.low?`<span class="pill p-low">${r.low}</span>`:'<span class="dim">0</span>'}</td>
      <td class="num">${r.neg?`<span class="pill p-neg">${r.neg}</span>`:'<span class="dim">0</span>'}</td>
    </tr>`;
  }
  document.getElementById('tbl-sum').innerHTML=h+'</tbody>';
}

function renderList(){
  const q=document.getElementById('q').value.toLowerCase();
  const fc=document.getElementById('fcat').value;
  let rows=DATA.skus.filter(r=>{
    if(fc&&r.cat!==fc) return false;
    if(q&&!r.sku.toLowerCase().includes(q)) return false;
    if(statusFilter==='excess'&&!r.exc) return false;
    if(statusFilter==='low'&&!r.low) return false;
    if(statusFilter==='negative'&&!r.neg) return false;
    if(statusFilter==='ok'&&(r.exc||r.low||r.neg)) return false;
    return true;
  });
  const s=sortBy.list;
  rows.sort((a,b)=>{let x=a[s.k],y=b[s.k];
    if(x===null)x=-Infinity;if(y===null)y=-Infinity;
    return (x>y?1:x<y?-1:0)*s.dir;});
  let h=`<thead><tr>
    ${th(T('c_cat'),'cat','list')}${th(T('c_sku'),'sku','list')}${th(T('c_src'),'src','list')}
    ${th(T('c_safety'),'safety','list',1)}${th(T('c_bal'),'bal','list',1)}${th(T('c_days'),'days','list',1)}
    <th>${T('c_status')}</th></tr></thead><tbody>`;
  for(const r of rows){
    h+=`<tr><td><b>${r.cat}</b></td><td>${r.sku}</td><td class="dim">${r.src}</td>
      <td class="num">${fmt(r.safety)}</td><td class="num">${fmt(r.bal,1)}</td><td class="num">${fmt(r.days)}</td>
      <td>${statusPills(r)}</td></tr>`;
  }
  document.getElementById('tbl-list').innerHTML=h+'</tbody>';
  document.getElementById('cnt').textContent=`${rows.length} ${T('shown')}${LANG==='ja'?DATA.skus.length:DATA.skus.length} ${T('items')}`.trim();
}

function renderChips(){
  const opts=[['all','all'],['excess','st_exc'],['low','st_low'],['negative','st_neg'],['ok','st_ok']];
  document.getElementById('chips').innerHTML=opts.map(([v,k])=>
    `<button class="chip ${statusFilter===v?'on':''}" onclick="statusFilter='${v}';renderChips();renderList()">${v==='all'?T('all'):T(k)}</button>`).join('');
}

function renderRecon(){
  const r=DATA.recon, k=DATA.kpi;
  const tpl=k.gate_ok?T('verdict_ok'):T('verdict_bad');
  const msg=tpl.replace('{p}',k.total).replace('{e}',DATA.expected_total)
    .replace('{P}',k.pass).replace('{W}',k.warn).replace('{F}',k.fail);
  document.getElementById('verdict').innerHTML=
    `<div class="banner ${k.gate_ok?'ok':'bad'}"><span class="b">${k.gate_ok?'✓':'⚠'}</span><span>${msg}</span></div>`;
  document.getElementById('h-recon').textContent=T('h_recon');
  document.getElementById('d-recon').textContent=T('d_recon');
  let h=`<thead><tr><th>${T('c_cat')}</th><th>${T('c_file')}</th>
    <th class="num">${T('c_parsed')}</th><th class="num">${T('c_exp')}</th><th class="num">${T('c_blocks')}</th>
    <th>${T('c_status')}</th><th>${T('c_note')}</th></tr></thead><tbody>`;
  for(const x of r){
    const pc={PASS:'p-pass',WARN:'p-warn',FAIL:'p-fail'}[x.status];
    h+=`<tr><td><b>${x.cat}</b></td><td class="dim">${x.file}</td>
      <td class="num mono">${x.parsed}</td><td class="num mono">${x.expected}</td><td class="num mono">${x.blocks}</td>
      <td><span class="pill ${pc}">${x.status}</span></td><td class="dim">${x.note||''}</td></tr>`;
  }
  document.getElementById('tbl-recon').innerHTML=h+'</tbody>';
}

function renderStatic(){
  document.getElementById('t-title').textContent=T('title');
  document.getElementById('t-sub').textContent=T('sub');
  document.getElementById('b-refresh').innerHTML=
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>${T('refresh')}`;
  document.getElementById('b-download').innerHTML=
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/></svg>${T('download')}`;
  document.getElementById('tab-sum').textContent='📁 '+T('tab_sum');
  document.getElementById('tab-list').textContent='📋 '+T('tab_list');
  document.getElementById('tab-recon').textContent='✅ '+T('tab_recon');
  document.getElementById('tab-master').textContent='⚙️ '+T('tab_master');
  document.getElementById('tab-anom').textContent='⚠️ '+T('tab_anom');
  document.getElementById('tab-proc').textContent='📦 '+T('tab_proc');
  document.getElementById('tab-stock').textContent='🗄️ '+T('s_tab');
  if(MASTER) renderMaster();
  if(ANOM) renderAnom();
  if(PROC) renderProc();
  if(STOCK) renderStock();
  document.getElementById('q').placeholder=T('search');
  document.getElementById('foot').textContent=T('foot');
  // category filter options
  const cats=[...new Set(DATA.skus.map(r=>r.cat))];
  const sel=document.getElementById('fcat');
  sel.innerHTML=`<option value="">${T('c_cat')}: ${T('all')}</option>`+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function renderAll(){renderStatic();renderKpis();renderSum();renderChips();renderList();renderRecon();}

async function refresh(){
  const b=document.getElementById('b-refresh');b.style.opacity=.6;b.style.pointerEvents='none';
  b.textContent='⏳ '+T('refreshing');
  try{await fetch('/refresh',{method:'POST'});location.reload();}
  catch(e){alert('refresh failed: '+e);b.style.opacity=1;b.style.pointerEvents='auto';}
}

renderAll();
</script>
</body>
