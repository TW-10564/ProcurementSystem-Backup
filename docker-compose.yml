# ONE forecasting portal — DGX deployment.
#
#   cp deploy/compose.env.example .env      # then edit
#   docker compose build --build-arg VITE_API_KEY="$ONEFCST_API_KEY"
#   docker compose up -d
#
# TLS and Entra ID sign-in are handled by nginx on the HOST
# (deploy/nginx-onefcst.conf), which proxies to 127.0.0.1:8600. The app port
# is deliberately bound to loopback only so nothing reaches it unencrypted.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onefcst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-onefcst}
      # naive datetimes are compared against datetime.utcnow() in
      # scheduler.py; pin the timezone so a host TZ change can't shift
      # "is this run due?" by hours
      TZ: ${TZ:-Asia/Tokyo}
      PGTZ: ${TZ:-Asia/Tokyo}
    command:
      - postgres
      # Backstop for the drop_all lock problem: build.py sets its own
      # lock_timeout so a blocked DROP fails fast, but that only helps if
      # the blocker eventually goes away. This bounds how long any single
      # leaked "idle in transaction" session (a report endpoint whose
      # request died mid-flight) can hold locks at all.
      - -c
      - idle_in_transaction_session_timeout=300000
      # DROP SCHEMA/TABLE across 16 tables takes a lot of locks at once
      - -c
      - max_locks_per_transaction=256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # app's depends_on waits for this, so a rebuild can't start against a
      # database that is still initialising
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onefcst} -d ${POSTGRES_DB:-onefcst}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        # baked into the JS bundle at build time — see Dockerfile
        VITE_API_KEY: ${ONEFCST_API_KEY:-}
        # Entra SSO. Public ids, safe to bake in; no client secret exists in
        # this flow. Both empty = pre-SSO bundle. Changing them needs a REBUILD.
        VITE_ENTRA_TENANT_ID: ${ONEFCST_ENTRA_TENANT_ID:-}
        VITE_ENTRA_CLIENT_ID: ${ONEFCST_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:-}
    # Named explicitly rather than derived from the project/directory name, so
    # the CD workflow can roll back by re-tagging a known image
    # (.github/workflows/deploy.yml).
    image: onefcst-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-onefcst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-onefcst}
      TZ: ${TZ:-Asia/Tokyo}

      # Auth is OPEN when this is empty (api/auth.py) — must be set here.
      ONEFCST_API_KEY: ${ONEFCST_API_KEY:?set ONEFCST_API_KEY in .env}
      ONEFCST_CORS_ORIGINS: ${ONEFCST_CORS_ORIGINS:-}
      ONEFCST_RATE_LIMIT_PER_MINUTE: ${ONEFCST_RATE_LIMIT_PER_MINUTE:-120}

      # Entra ID SSO — set both to require a Microsoft identity on every
      # request (api/entra.py verifies the token; it holds no credential of
      # its own). Deliberately the SAME values as the VITE_* build args above:
      # the bundle and the verifier must agree, and a mismatch shows up as
      # "token was not issued for this application".
      ONEFCST_ENTRA_TENANT_ID: ${ONEFCST_ENTRA_TENANT_ID:-}
      ONEFCST_ENTRA_CLIENT_ID: ${ONEFCST_ENTRA_CLIENT_ID:-}
      ONEFCST_ENTRA_AUDIENCE: ${ONEFCST_ENTRA_AUDIENCE:-}
      # 1 keeps the shared key working for scripted callers; 0 makes a
      # Microsoft sign-in the only way in.
      ONEFCST_ENTRA_ALLOW_API_KEY: ${ONEFCST_ENTRA_ALLOW_API_KEY:-1}
      ONEFCST_ENTRA_ALLOWED_GROUPS: ${ONEFCST_ENTRA_ALLOWED_GROUPS:-}
      # Named-user allowlist, for before Entra "assignment required" is set.
      ONEFCST_ENTRA_ALLOWED_EMAILS: ${ONEFCST_ENTRA_ALLOWED_EMAILS:-}
      # Backend-driven sign-in (confidential client). Set the secret and the
      # redirect URI and the server runs the flow itself; leave the secret
      # empty and the MSAL/PKCE path is used instead.
      ONEFCST_ENTRA_CLIENT_SECRET: ${ONEFCST_ENTRA_CLIENT_SECRET:-}
      ONEFCST_OAUTH_REDIRECT_URI: ${ONEFCST_OAUTH_REDIRECT_URI:-}
      ONEFCST_SESSION_SECRET: ${ONEFCST_SESSION_SECRET:-}
      ONEFCST_SESSION_HOURS: ${ONEFCST_SESSION_HOURS:-8}
      ONEFCST_SESSION_COOKIE_SECURE: ${ONEFCST_SESSION_COOKIE_SECURE:-1}
      ONEFCST_BOOTSTRAP_ADMINS: ${ONEFCST_BOOTSTRAP_ADMINS:-}

      # Read-only NAS sources, as seen INSIDE the container (see volumes).
      ONE_SOURCE_DIR: /mnt/nas/one
      # 企画部's ①②③④ drop lives INSIDE the ONE share, in ★販売計画（企画部）
      # (confirmed 2026-07-30), so it needs no mount of its own — it is already
      # under /mnt/nas/one. Overridable for the interim period while those four
      # files still arrive by hand: point NAS_PLANNING_DIR at a host directory
      # you upload into and set PLANNING_DIR back to /mnt/nas/planning.
      PLANNING_DIR: ${PLANNING_DIR_IN_CONTAINER:-/mnt/nas/one/★販売計画（企画部）}
      SAP_DIR: /srv/sap
      # nas_sync.py is WSL/Windows-interop only and cannot run here; the
      # share is mounted on the host instead. Phase 5 adds an explicit
      # branch so this reports "mounted directly" rather than a silent skip.
      ONEFCST_NAS_MODE: mount

      ONEFCST_SCHEDULER_ENABLED: ${ONEFCST_SCHEDULER_ENABLED:-1}
      ONEFCST_DB_BACKUP_KEEP: ${ONEFCST_DB_BACKUP_KEEP:-7}
      ONEFCST_DROP_LOCK_TIMEOUT: ${ONEFCST_DROP_LOCK_TIMEOUT:-15s}
      ONEFCST_LLM_API_KEY: ${ONEFCST_LLM_API_KEY:-}
    volumes:
      # The only writable location: SQLite-era data dir, still used for
      # exports, pg_dump backups and maintenance.json (deliberately a FILE
      # so it is readable when the DB is down — see maintenance.py).
      #
      # Overridable, and on the DGX it MUST point outside the repo
      # (/srv/onefcst/data). CD checks the code out into the runner's
      # workspace and `actions/checkout` runs `git clean -ffdx` on an existing
      # clone — with the default relative path that would delete every backup
      # and export on the first deploy.
      - ${ONEFCST_DATA_HOST_DIR:-./app/data}:/opt/onefcst/app/data

      # NAS, mounted read-only on the HOST by a systemd .mount unit and
      # passed straight through. Read-only at BOTH layers enforces the
      # Phase-1 rule that ONE source files are never written (CLAUDE.md #1).
      - ${NAS_ONE_DIR:-/mnt/nas/one}:/mnt/nas/one:ro
      # Only used while planning files are still hand-uploaded rather than
      # dropped in ★販売計画（企画部） on the share; harmless when unused.
      - ${NAS_PLANNING_DIR:-/mnt/nas/planning}:/mnt/nas/planning:ro
      # SAP_DIR, writable: holds the hand-placed files that are NOT on the
      # share (SAP部材管理_詳細版*.xlsx — verified 2026-07-30, it is nowhere in
      # the ONE folder).
      - ${SAP_CACHE_HOST_DIR:-./data/sap}:/srv/sap

      # …and the two weekly SAP drops come straight off the mounted share, as
      # read-only subfolders of SAP_DIR. This is LOAD-BEARING since 2026-07-30:
      # stock is now read from the ZM13 files, and in mount mode nas_sync is a
      # no-op, so nothing would ever populate /srv/sap — the DGX would run with
      # NO stock data and no order suggestions at all.
      #
      # The container-side names match the dev cache layout
      # (data/sap/週頭在庫_ZM13, data/sap/組込実績_ZP21) so both environments see
      # an identical tree under SAP_DIR. Note the NAS folders use HALF-width
      # parens for (ZM13)/(ZP21) and FULL-width for （企画部） — exact names,
      # verified against the share.
      - ${NAS_ZM13_DIR:-/mnt/nas/one/★週頭在庫(ZM13)}:/srv/sap/週頭在庫_ZM13:ro
      - ${NAS_ZP21_DIR:-/mnt/nas/one/★組込実績(ZP21)}:/srv/sap/組込実績_ZP21:ro
    ports:
      # loopback only — nginx on the host is the sole public entry point
      - "127.0.0.1:8600:8600"

volumes:
  pgdata:
