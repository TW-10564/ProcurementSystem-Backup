# Reverse proxy + TLS for the CONTAINER deployment (docker-compose.yml).
#
# Difference from nginx-onefcst.conf (the systemd variant, kept as the
# standing fallback): there is no `root`/`try_files` static block here. The
# app container already serves the built SPA on 8600 with a 404 ->
# index.html fallback (api/main.py mounts frontend/dist outside the auth
# gate), so nginx proxies EVERYTHING to one upstream. One place that knows
# how to serve the SPA, not two that can disagree.
#
# Install: sudo cp deploy/nginx-onefcst-docker.conf /etc/nginx/sites-available/onefcst
#          sudo ln -s /etc/nginx/sites-available/onefcst /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream onefcst_app {
    server 127.0.0.1:8600;
    keepalive 16;
}

server {
    listen 80;
    server_name one-forecast.twave.co.jp;      # DNS A record -> 172.16.5.106 (registered 2026-07-29)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name one-forecast.twave.co.jp;      # DNS A record -> 172.16.5.106 (registered 2026-07-29)

    ssl_certificate     /etc/onefcst/tls/onefcst.crt;
    ssl_certificate_key /etc/onefcst/tls/onefcst.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- security headers (added by the 2026-07-30 audit) ----------------
    # HSTS: without it the 80->443 redirect is still one interceptable plain
    # request per fresh visit. 1 year, no preload (internal hostname).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The dashboard renders only its own bundle and JSON from this origin, so
    # a strict CSP costs nothing here and removes the payoff of any future
    # injected-content bug. 'unsafe-inline' for styles only — Vite emits an
    # inline style block; scripts stay strict.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Excel exports have Japanese filenames; the backend sets
    # Content-Disposition and CORSMiddleware exposes it. Don't let nginx
    # truncate large report bodies.
    client_max_body_size 32m;
    proxy_read_timeout 300s;             # report endpoints can run minutes

    # ---------------------------------------------------------------------
    # Entra ID SSO — SCAFFOLDING, INTENTIONALLY DISABLED.
    #
    # Everything needed is here; it activates when the platform team returns
    # the tenant/client/secret and you start the oauth2-proxy service:
    #
    #   1. fill ENTRA_* in .env
    #   2. docker compose -f docker-compose.yml -f deploy/docker-compose.sso.yml up -d
    #   3. uncomment the auth_request lines below and the /oauth2/ block
    #   4. sudo nginx -t && sudo systemctl reload nginx
    #
    # Deliberately left OFF rather than half-configured: a broken
    # auth_request returns 500 on every request, which is a worse failure
    # than "no SSO yet". The shared X-API-Key stays in force either way.
    #
    #   auth_request /oauth2/auth;
    #   error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;
    #   auth_request_set $user  $upstream_http_x_auth_request_user;
    #   auth_request_set $email $upstream_http_x_auth_request_email;
    #   auth_request_set $roles $upstream_http_x_auth_request_groups;
    #   proxy_set_header X-Forwarded-User   $user;
    #   proxy_set_header X-Forwarded-Email  $email;
    #   proxy_set_header X-Forwarded-Roles  $roles;
    #
    # location /oauth2/ {
    #     proxy_pass       http://127.0.0.1:4180;
    #     proxy_set_header Host             $host;
    #     proxy_set_header X-Real-IP        $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    # }
    # location = /oauth2/auth {
    #     proxy_pass       http://127.0.0.1:4180;
    #     proxy_set_header Host             $host;
    #     proxy_set_header X-Real-IP        $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Content-Length   "";
    #     proxy_pass_request_body           off;
    # }
    # ---------------------------------------------------------------------

    # API. The trailing slash on proxy_pass strips the /api prefix, so
    # /api/forecasts reaches the backend as /forecasts (its real route name).
    location /api/ {
        proxy_pass http://onefcst_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the container runs
        # uvicorn with --forwarded-allow-ips '*' (it cannot know the docker
        # gateway address in advance), and uvicorn then takes the LEFTMOST
        # X-Forwarded-For entry — which is whatever the client sent. Appending
        # would let any browser choose the IP the app sees, defeating the
        # per-IP rate limit that exists to slow API-key guessing, and poisoning
        # the access log. Overwriting here is what makes that safe.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Everything else: the SPA, served by the same container.
    location / {
        proxy_pass http://onefcst_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the container runs
        # uvicorn with --forwarded-allow-ips '*' (it cannot know the docker
        # gateway address in advance), and uvicorn then takes the LEFTMOST
        # X-Forwarded-For entry — which is whatever the client sent. Appending
        # would let any browser choose the IP the app sees, defeating the
        # per-IP rate limit that exists to slow API-key guessing, and poisoning
        # the access log. Overwriting here is what makes that safe.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
