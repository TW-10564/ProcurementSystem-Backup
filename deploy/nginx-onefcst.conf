# Reverse proxy + TLS termination for onefcst, internal-network deployment.
#
# Single origin by design: the browser only ever talks to THIS host over
# HTTPS. Everything under /api/ is proxied to the backend (bound to
# 127.0.0.1:8600 only, see onefcst-backend.service); everything else is the
# frontend's static build. Same-origin means the browser needs no CORS
# headers for normal use — ONEFCST_CORS_ORIGINS in config.py is still worth
# setting correctly as defense-in-depth, but it is not what makes this
# setup work.
#
# Install: sudo cp nginx-onefcst.conf /etc/nginx/sites-available/onefcst
#          sudo ln -s /etc/nginx/sites-available/onefcst /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name one-forecast.twave.co.jp;   # DNS A record -> 172.16.5.106
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name one-forecast.twave.co.jp;   # DNS A record -> 172.16.5.106

    # Self-signed for internal-only use — see deploy/generate-self-signed-cert.sh.
    # Swap for a real internal-CA-issued cert if one is available; browsers
    # will otherwise show a trust warning on first visit (expected and safe
    # to click through / add as an exception on a trusted internal network,
    # but if that's not acceptable, use the internal CA instead).
    ssl_certificate     /etc/onefcst/tls/onefcst.crt;
    ssl_certificate_key /etc/onefcst/tls/onefcst.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- security headers (added by the 2026-07-30 audit) ----------------
    # HSTS: without it the 80->443 redirect is still one interceptable plain
    # request per fresh visit. 1 year, no preload (internal hostname).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The dashboard renders only its own bundle and JSON from this origin, so
    # a strict CSP costs nothing here and removes the payoff of any future
    # injected-content bug. 'unsafe-inline' for styles only — Vite emits an
    # inline style block; scripts stay strict.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Frontend: static build output (run `npm run build` in app/frontend,
    # which writes to app/frontend/dist/ — copy or symlink that here).
    root /opt/onefcst/app/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA client-side routing
    }

    # Backend API — proxy_pass with the trailing slash strips the /api/
    # prefix, so /api/forecasts reaches the backend as /forecasts (matching
    # its actual route names, which have no /api prefix of their own).
    location /api/ {
        proxy_pass http://127.0.0.1:8600/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the container runs
        # uvicorn with --forwarded-allow-ips '*' (it cannot know the docker
        # gateway address in advance), and uvicorn then takes the LEFTMOST
        # X-Forwarded-For entry — which is whatever the client sent. Appending
        # would let any browser choose the IP the app sees, defeating the
        # per-IP rate limit that exists to slow API-key guessing, and poisoning
        # the access log. Overwriting here is what makes that safe.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
